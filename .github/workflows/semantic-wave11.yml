name: Manual CATS Wave 11 Semantic Gate

on:
  push:
    branches:
      - wave11-semantic-architecture
    paths:
      - 'rebuild/content/**'
      - 'rebuild/scripts/semantic-model.mjs'
      - 'rebuild/scripts/migrate-semantic.mjs'
      - 'rebuild/scripts/validate-semantic.mjs'
      - 'rebuild/package.json'
      - '.github/workflows/semantic-wave11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  semantic-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Migrate 249 pages to semantic architecture
        run: npm run semantic:migrate

      - name: Validate lossless semantic migration
        run: npm run semantic:validate

      - name: Validate canonical corpus contracts
        run: npm run validate

      - name: Build unchanged reader
        run: npm run build

      - name: Smoke unchanged reader
        run: npm run smoke

      - name: Persist validated semantic corpus
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebuild/content/semantic-pages.json
          if ! git diff --cached --quiet; then
            git commit -m "wave11: persist validated semantic corpus [skip ci]"
            git push origin HEAD:wave11-semantic-architecture
          fi

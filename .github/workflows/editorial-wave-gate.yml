name: Manual CATS Legacy Editorial Gate (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-editorial-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run smoke

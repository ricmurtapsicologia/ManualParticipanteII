name: Rebuild Wave 2 CI

on:
  push:
    branches: [rebuild-clean-v1]
    paths:
      - 'rebuild/**'
      - '.github/workflows/rebuild-wave1-ci.yml'
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate contracts
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Smoke runtime
        run: npm run smoke

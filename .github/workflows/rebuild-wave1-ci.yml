name: Rebuild Wave 8 Canonical Corpus CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-validate-build-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Migrate canonical 249-page corpus
        run: npm run migrate:249
      - name: Validate contracts and provenance
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Smoke runtime
        run: npm run smoke

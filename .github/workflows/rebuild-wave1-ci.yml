name: Rebuild Wave 8 Recovery CI

on:
  push:
    branches: [rebuild-clean-v1]
    paths:
      - 'rebuild/**'
      - 'data*.js'
      - '.github/workflows/rebuild-wave1-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-migrate-build-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Historical recovery scan
        run: |
          if [ -f recovery/history-scan.json ] && grep -q '"scannerVersion": 2' recovery/history-scan.json; then
            echo "Historical recovery report v2 already persisted"
          else
            node scripts/recovery-scan.mjs
          fi
      - name: v0.8 recovery scan
        run: node scripts/v08-recovery-scan.mjs
      - name: Migrate canonical pages 1-155
        run: npm run migrate:155
      - name: Validate contracts
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Smoke runtime
        run: npm run smoke
      - name: Persist validated corpus and recovery reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pages.json content/provenance.json
          if [ -f recovery/history-scan.json ]; then
            git add recovery/history-scan.json recovery/history-scan.md
          fi
          if [ -f recovery/v08-scan.json ]; then
            git add recovery/v08-scan.json recovery/v08-scan.md
          fi
          if git diff --cached --quiet; then
            echo "Validated corpus and recovery reports already persisted"
            exit 0
          fi
          git commit -m "wave8: persist v0.8 recovery diagnostic and validated 155-page corpus [skip ci]"
          git push origin HEAD:rebuild-clean-v1

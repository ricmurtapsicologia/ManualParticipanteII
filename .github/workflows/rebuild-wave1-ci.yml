name: Rebuild Wave 5 CI

on:
  push:
    branches: [rebuild-clean-v1]
    paths:
      - 'rebuild/**'
      - 'data*.js'
      - '.github/workflows/rebuild-wave1-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-build-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Migrate canonical pages 1-100
        run: npm run migrate:100
      - name: Validate contracts
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Smoke runtime
        run: npm run smoke
      - name: Persist validated corpus
        run: |
          if git diff --quiet -- content/pages.json content/provenance.json; then
            echo "Validated corpus already persisted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pages.json content/provenance.json
          git commit -m "wave5: persist canonical 100-page corpus [skip ci]"
          git push origin HEAD:rebuild-clean-v1

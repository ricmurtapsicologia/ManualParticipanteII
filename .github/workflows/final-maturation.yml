name: Manual CATS Final Maturation

on:
  push:
    branches: [release/manual-2026-final]
    paths:
      - 'rebuild/**'
      - '.github/workflows/final-maturation.yml'

permissions:
  contents: write

jobs:
  mature-and-gate:
    if: ${{ !contains(github.event.head_commit.message, '[final-maturation]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rebuild
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/manual-2026-final

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Materialize final editorial and pedagogical maturation
        run: |
          sed -i 's/generate-canonical-pdf\.mjs/generate-accessible-pdf.mjs/g' scripts/final-maturation.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/final-maturation.mjs')
          s=p.read_text()
          old=r"\`${esc(correct.id)} — \${esc(stripLeadingBullet(correct.label))}\`"
          new=r"\`\${esc(correct.id)} — \${esc(stripLeadingBullet(correct.label))}\`"
          s=s.replace(old,new)
          p.write_text(s)
          PY
          node scripts/final-maturation.mjs
          python - <<'PY'
          import json
          from pathlib import Path

          semantic_path=Path('content/semantic-pages.json')
          semantic=json.loads(semantic_path.read_text())
          target='p180-b7-w7h-summary-3'
          old='• Agitação melhora com redução de estímulos e confronto.'
          new='• Agitação pode reduzir com menos estímulos e menor confrontação.'
          hits=0
          for page in semantic.get('pages', []):
              for block in page.get('blocks', []):
                  if block.get('id') == target:
                      if block.get('text') != old:
                          raise SystemExit(f'WAVE1_HOTFIX_FAIL unexpected text: {block.get("text")!r}')
                      block['text']=new
                      hits += 1
          if hits != 1:
              raise SystemExit(f'WAVE1_HOTFIX_FAIL target hits={hits}')
          semantic_path.write_text(json.dumps(semantic, ensure_ascii=False, indent=2)+'\n')
          print('WAVE1_HOTFIX_PASS agitation-summary=non-confrontational')

          trace_path=Path('content/doctrine-traceability.json')
          trace=json.loads(trace_path.read_text())
          trace.setdefault('policy', {})['atsAttsResolution']='VALIDATED_ITO30_2021'
          trace['policy']['atsAttsCanonical']='ATS = Atendimento a Tentativas de Suicídio; ATTS = Abordagem Técnica a Tentativas de Suicídio.'
          trace['policy']['normativeSource']='CBMMG. ITO 30: Atendimento a Tentativas de Suicídio. 1. ed. 2021.'
          resolved=0
          for topic in trace.get('highRiskTopics', []):
              if topic.get('topic') == 'Sistema ATS/ATTS e fases operacionais':
                  topic['status']='VALIDATED_ITO30_2021_ATS_ATTS_DISTINCTION'
                  resolved += 1
          if resolved != 1:
              raise SystemExit(f'WAVE1_TRACEABILITY_FAIL ats-atts topics={resolved}')
          trace_path.write_text(json.dumps(trace, ensure_ascii=False, indent=2)+'\n')
          print('WAVE1_TRACEABILITY_PASS ATS=attendance ATTS=technical-approach')
          PY

      - name: Validate source after maturation
        run: npm run source:validate

      - name: Generate canonical PDF before commit
        run: npm run pdf:generate && npm run pdf:preflight

      - name: Commit deterministic maturation locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content app scripts
          if git diff --cached --quiet; then
            echo "No maturation changes to commit"
          else
            git commit -m "feat: final editorial pedagogical maturation [final-maturation]"
          fi

      - name: Build from clean committed source
        run: npm run build

      - name: Smoke release locally
        run: npm run smoke

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Chromium — manual
        run: npx playwright test --project=chromium e2e/manual.spec.ts

      - name: Chromium — pedagogy
        run: npx playwright test --project=chromium e2e/pedagogy.spec.ts

      - name: Chromium — microlearning
        run: npx playwright test --project=chromium e2e/microlearning.spec.ts

      - name: Chromium — multimedia
        run: npx playwright test --project=chromium e2e/multimedia.spec.ts

      - name: Chromium — publication hotfix
        run: npx playwright test --project=chromium e2e/publication-hotfix.spec.ts

      - name: Chromium — EPUB release
        run: npx playwright test --project=chromium e2e/epub-release.spec.ts

      - name: Chromium — responsive visual
        run: npx playwright test --project=chromium e2e/responsive-visual.spec.ts

      - name: Push gated maturation commit
        shell: bash
        run: git push origin HEAD:release/manual-2026-final

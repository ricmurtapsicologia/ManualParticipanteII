name: PDF + EPUB Publication Release Gate

on:
  push:
    branches: [saneamento/qep-fase1-execucao, prontidao/final-6-ondas]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-pdf-epub:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        working-directory: rebuild
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize canonical publication content
        working-directory: rebuild
        run: npm run content:materialize
      - name: Verify canonical content is already materialized
        run: |
          git diff --exit-code -- rebuild/content/
          echo "QEP_CHECKPOINT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "Canonical content clean at $GITHUB_SHA"
      - name: Build deterministic publication artifacts
        working-directory: rebuild
        run: npm run build
      - name: Verify Git source tree is clean
        run: |
          git diff --exit-code
          CHANGES="$(git status --porcelain --untracked-files=all | grep -Ev '^(\?\?| M|M ) rebuild/(public/downloads/|reports/|\.next/|test-results/|playwright-report/|\.lighthouseci\/)' || true)"
          test -z "$CHANGES" || { echo "$CHANGES"; exit 1; }
      - name: Install publication inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils jq default-jre-headless unzip
      - name: Full PDF text parity and intelligent condensation
        working-directory: rebuild
        run: |
          mkdir -p reports
          PDF=public/downloads/Manual-do-Participante-CATS-Edicao-Digital-2026.pdf
          pdftotext -layout -nopgbrk "$PDF" reports/pdf-extracted.txt
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const semantic=JSON.parse(fs.readFileSync('content/semantic-pages.json','utf8'));
          const pre=JSON.parse(fs.readFileSync('public/downloads/manual-preflight.json','utf8'));
          const norm=v=>String(v??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[\u00ad\u200b☐□]/g,'').replace(/-\s*\n\s*/g,'-').replace(/\/\s*\n\s*/g,'/').replace(/\s+/g,' ').trim().toLowerCase();
          const pdf=norm(fs.readFileSync('reports/pdf-extracted.txt','utf8'));
          const items=(semantic.pages??[]).flatMap(p=>[{page:p.number,text:p.title},...(p.blocks??[]).map(b=>({page:p.number,text:b.text}))]).filter(x=>norm(x.text).length>1);
          const coverLine=norm('Manual do Participante • Edição Digital Interativa • 2026');
          const coverSegments=['Manual do Participante','Edição Digital Interativa','2026'].map(norm);
          const missing=[];
          for(const item of items){const n=norm(item.text);if(pdf.includes(n))continue;if(item.page===1&&n===coverLine&&coverSegments.every(s=>pdf.includes(s)))continue;missing.push({page:item.page,text:String(item.text).slice(0,160)});}
          const maxResidual=Number(pre.layout?.measuredMaxResidualBlankAreaExcludingLastRegular??1);
          const ok=missing.length===0&&pre.sourcePageCount===semantic.pages.length&&pre.logicalPageMap?.length===semantic.pages.length&&pre.pageCount<pre.sourcePageCount&&pre.bodyTypography?.sizePt>=11.2&&pre.bodyTypography?.leadingPt>=16&&maxResidual<=0.20;
          const report={status:ok?'PASS':'FAIL',logicalPages:pre.sourcePageCount,physicalPages:pre.pageCount,blocksChecked:items.length,blocksMissing:missing.length,bodyTypography:pre.bodyTypography,maxResidualBlankArea:maxResidual,missing:missing.slice(0,50)};
          fs.writeFileSync('reports/parity-report.json',JSON.stringify(report,null,2));console.log(report);if(!ok)process.exit(1);
          NODE
      - name: PDF rendering smoke all physical pages
        working-directory: rebuild
        run: |
          mkdir -p reports/render
          PDF=public/downloads/Manual-do-Participante-CATS-Edicao-Digital-2026.pdf
          EXPECTED=$(node -p "require('./public/downloads/manual-preflight.json').pageCount")
          LOGICAL=$(node -p "require('./public/downloads/manual-preflight.json').sourcePageCount")
          ACTUAL=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          test "$ACTUAL" = "$EXPECTED"
          test "$ACTUAL" -lt "$LOGICAL"
          pdftoppm -jpeg -r 55 -jpegopt quality=48 "$PDF" reports/render/page >/dev/null 2>&1
          RENDERED=$(find reports/render -type f -name 'page-*.jpg' | wc -l)
          test "$RENDERED" = "$EXPECTED"
          test -z "$(find reports/render -type f -name 'page-*.jpg' -size 0)"
          echo "PDF_RENDER_SMOKE_OK physical=$ACTUAL logical=$LOGICAL"
      - name: veraPDF PDF/UA-1 validation
        working-directory: rebuild
        run: |
          mkdir -p reports
          VERAPDF_EXIT=0
          docker run --rm -v "$PWD:/data" verapdf/cli:v1.30.2@sha256:d5ee329657cf9bc4b2400392dd54c7d0a0ce9980ff6fa2da5590eebeec007cdb --format json --flavour ua1 "/data/public/downloads/Manual-do-Participante-CATS-Edicao-Digital-2026.pdf" > reports/verapdf.json || VERAPDF_EXIT=$?
          if [ "$VERAPDF_EXIT" -ne 0 ] || ! jq -e '.report.jobs[0].validationResult[0].compliant == true' reports/verapdf.json >/dev/null; then
            jq -r '.report.jobs[0].validationResult[0].details.ruleSummaries[] | select((.ruleStatus == "FAILED") or (.status == "failed") or ((.failedChecks // 0) > 0)) | "clause=\(.clause) test=\(.testNumber) failed=\(.failedChecks) :: \(.description)"' reports/verapdf.json | head -100 || true
            exit 1
          fi
          echo "VERAPDF_PDFUA_PASS"
      - name: EPUBCheck 5.3.0 EPUB 3.3 validation
        working-directory: rebuild
        run: |
          mkdir -p reports public/downloads /tmp/epubcheck
          npm run start -- -p 3101 > /tmp/cats-epub-next.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          READY=0
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3101/api/health >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then cat /tmp/cats-epub-next.log; exit 1; fi
          EPUB=public/downloads/Manual-do-Participante-CATS-Edicao-Digital-2026.epub
          curl -fsS http://127.0.0.1:3101/api/epub -o "$EPUB"
          kill $PID 2>/dev/null || true
          trap - EXIT
          test -s "$EPUB"
          curl -fsSL https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip -o /tmp/epubcheck.zip
          echo "6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5  /tmp/epubcheck.zip" | sha256sum -c -
          unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck
          JAR=$(find /tmp/epubcheck -name epubcheck.jar -print -quit)
          java -jar "$JAR" --failonwarnings --json reports/epubcheck.json "$EPUB"
          echo "EPUBCHECK_EPUB33_PASS file=$EPUB"
      - name: EPUB semantic, cover and 223-marker integrity
        working-directory: rebuild
        run: |
          EPUB=public/downloads/Manual-do-Participante-CATS-Edicao-Digital-2026.epub
          unzip -t "$EPUB" >/dev/null
          python - <<'PY'
          import re, zipfile, xml.etree.ElementTree as ET
          from pathlib import Path
          epub=Path('public/downloads/Manual-do-Participante-CATS-Edicao-Digital-2026.epub')
          with zipfile.ZipFile(epub) as z:
              names=set(z.namelist())
              assert 'OEBPS/cover.svg' in names and 'OEBPS/cover.webp' not in names
              ET.fromstring(z.read('OEBPS/cover.svg'))
              manual=z.read('OEBPS/manual.xhtml').decode('utf-8')
              cover=z.read('OEBPS/cover.xhtml').decode('utf-8')
              assert manual.count('epub:type="pagebreak"') == 222
              assert cover.count('epub:type="pagebreak"') == 1
              assert '<ul class="list">' in manual
              assert '• </span>•' not in manual
              assert not re.search(r'<p class="boxLabel">([^<]+)</p><p>\1</p>', manual, re.I)
              assert '<p class="reference">' in manual
          print('EPUB_PACKAGE_INTEGRITY_PASS markers=223 cover=svg lists=semantic references=hanging')
          PY
      - name: Publication checkpoint summary
        working-directory: rebuild
        run: |
          node - <<'NODE'
          const p=require('./public/downloads/manual-preflight.json');
          console.log(`PUBLICATION_GATE_PASS checkpoint=${process.env.QEP_CHECKPOINT} PDF-UA-1 EPUB3.3 logical=${p.sourcePageCount} physical=${p.pageCount} body=${p.bodyTypography.sizePt}/${p.bodyTypography.leadingPt}`)
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qep-pdf-epub-evidence
          path: |
            rebuild/reports/
            rebuild/public/downloads/manual-preflight.json
            rebuild/public/downloads/Manual-do-Participante-CATS-Edicao-Digital-2026.pdf
            rebuild/public/downloads/Manual-do-Participante-CATS-Edicao-Digital-2026.epub
          retention-days: 30

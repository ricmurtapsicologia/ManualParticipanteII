name: Materialize and QEP Release Gate

on:
  push:
    branches: [saneamento/qep-fase1-execucao]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-qep:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: saneamento/qep-fase1-execucao
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        working-directory: rebuild
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize canonical publication artifacts
        working-directory: rebuild
        run: npm run content:materialize
      - name: Commit materialized checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebuild/content/*.json rebuild/package-lock.json
          if git diff --cached --quiet; then
            git commit --allow-empty -m "chore(qep): checkpoint materializado [materialized]"
          else
            git commit -m "chore(qep): materializar estado final determinístico [materialized]"
          fi
          echo "QEP_CHECKPOINT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:saneamento/qep-fase1-execucao
      - name: Build deterministic artifact
        working-directory: rebuild
        run: npm run build
      - name: Verify Git source tree is clean
        run: |
          git diff --exit-code
          CHANGES="$(git status --porcelain --untracked-files=all | grep -Ev '^(\?\?| M|M ) rebuild/(public/downloads/|reports/|\.next/|test-results/|playwright-report/|\.lighthouseci\/)' || true)"
          test -z "$CHANGES" || { echo "$CHANGES"; exit 1; }
          echo "QEP source tree clean at $QEP_CHECKPOINT"
      - name: Install PDF inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils jq
      - name: Full PDF text parity
        working-directory: rebuild
        run: npm run pdf:parity
      - name: PDF rendering smoke all pages
        working-directory: rebuild
        run: |
          mkdir -p reports/render
          PDF=public/downloads/Manual-do-Participante-CATS-Edicao-Digital-2026.pdf
          EXPECTED=$(node -p "require('./public/downloads/manual-preflight.json').pageCount")
          ACTUAL=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          test "$ACTUAL" = "$EXPECTED"
          pdftoppm -jpeg -r 45 -jpegopt quality=45 "$PDF" reports/render/page >/dev/null 2>&1
          RENDERED=$(find reports/render -type f -name 'page-*.jpg' | wc -l)
          test "$RENDERED" = "$EXPECTED"
          test -z "$(find reports/render -type f -name 'page-*.jpg' -size 0)"
          echo "PDF_RENDER_SMOKE_OK pages=$ACTUAL"
      - name: veraPDF PDF/UA-1 validation
        working-directory: rebuild
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/data" verapdf/cli:v1.30.2 --format json --flavour ua1 "/data/public/downloads/Manual-do-Participante-CATS-Edicao-Digital-2026.pdf" > reports/verapdf.json
          if ! jq -e '.. | objects | select(has("isCompliant")) | .isCompliant == true' reports/verapdf.json >/dev/null; then
            echo "veraPDF encontrou não conformidades PDF/UA-1:"
            jq -r '.. | objects | select((.status? == "failed") or (.passed? == false) or (.isCompliant? == false)) | [.testNumber // .ruleId // .id // "rule", .description // .message // .status // "failed"] | @tsv' reports/verapdf.json | head -100 || true
            exit 1
          fi
          echo "VERAPDF_PDFUA_PASS"
      - name: Runtime smoke 6/6
        working-directory: rebuild
        run: |
          npm run start -- -p 3100 > /tmp/cats-next.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          READY=0
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3100/api/health >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then cat /tmp/cats-next.log; exit 1; fi
          BASE_URL=http://127.0.0.1:3100 npm run audit:6
          kill $PID 2>/dev/null || true
          trap - EXIT
      - name: Install Playwright browsers
        working-directory: rebuild
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser accessibility and E2E
        working-directory: rebuild
        run: npm run e2e:qep
      - name: Core regression smoke/E2E in Chromium
        working-directory: rebuild
        run: npx playwright test --project=chromium e2e/manual.spec.ts e2e/publication-hotfix.spec.ts e2e/epub-release.spec.ts
      - name: Lighthouse CI
        working-directory: rebuild
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.json
      - name: QEP checkpoint summary
        run: echo "QEP_FULL_GATE_PASS checkpoint=$QEP_CHECKPOINT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qep-release-evidence
          path: |
            rebuild/reports/
            rebuild/public/downloads/manual-preflight.json
            rebuild/public/downloads/Manual-do-Participante-CATS-Edicao-Digital-2026.pdf
          retention-days: 30

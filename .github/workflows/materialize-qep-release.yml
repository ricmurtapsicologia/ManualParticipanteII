name: Materialize QEP Release State

on:
  push:
    branches: [saneamento/qep-fase1-execucao]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: saneamento/qep-fase1-execucao
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: rebuild
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Materialize canonical publication artifacts
        working-directory: rebuild
        run: |
          npm run content:materialize
          npm run audit:30
          npm run audit:90
          npm run audit:6
      - name: Commit only generated content state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebuild/content/*.json
          if git diff --cached --quiet; then
            echo "Publication content already materialized."
            exit 0
          fi
          git commit -m "chore(qep): materializar estado final determinístico [materialized]"
          git push origin HEAD:saneamento/qep-fase1-execucao

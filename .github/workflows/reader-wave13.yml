name: Manual CATS Wave 13 Reader Navigation Gate

on:
  push:
    branches: [wave13-reader-navigation]
    paths:
      - 'rebuild/app/**'
      - 'rebuild/content/**'
      - 'rebuild/e2e/**'
      - 'rebuild/scripts/**'
      - 'rebuild/package.json'
      - '.github/workflows/reader-wave13.yml'
      - '.github/workflows/rebuild-wave1-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reader-navigation-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Rebuild semantic corpus
        run: npm run semantic:migrate
      - name: Validate semantic corpus
        run: npm run semantic:validate
      - name: Build compact navigation artifact
        run: npm run navigation:build
      - name: Validate hierarchical navigation
        run: npm run navigation:validate
      - name: Validate canonical contracts
        run: npm run validate
      - name: Build production reader
        run: npm run build
      - name: Smoke reader
        run: npm run smoke
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local production server
        shell: bash
        run: |
          export VERCEL=1
          export VERCEL_ENV=production
          export VERCEL_GIT_COMMIT_REF=main
          export VERCEL_GIT_COMMIT_SHA=$(git rev-parse HEAD)
          export VERCEL_PROJECT_PRODUCTION_URL=manual-participante-cats-digital.vercel.app
          npm start -- -p 3000 >/tmp/wave13-next.log 2>&1 &
          echo $! >/tmp/wave13-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wave13-next.log
          exit 1
      - name: Run desktop and mobile E2E
        run: E2E_BASE_URL=http://127.0.0.1:3000 npm run e2e
      - name: Persist validated navigation artifact
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/navigation.json
          if ! git diff --cached --quiet; then
            git commit -m "wave13: persist validated reader navigation [skip ci]"
            git push origin HEAD:wave13-reader-navigation
          fi

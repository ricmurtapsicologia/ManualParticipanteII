name: QEP Release Gate

on:
  push:
    branches: [saneamento/qep-fase1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qep-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build deterministic artifact
        run: npm run build
      - name: Verify Git source tree is clean
        run: |
          git diff --exit-code
          CHANGES="$(git status --porcelain --untracked-files=all | grep -Ev '^(\?\?| M|M ) (rebuild/)?(public/downloads/|reports/|\.next/|test-results/|playwright-report/|\.lighthouseci\/)' || true)"
          test -z "$CHANGES" || { echo "$CHANGES"; exit 1; }
      - name: Install PDF inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils jq
      - name: Full PDF text parity
        run: npm run pdf:parity
      - name: PDF rendering smoke all pages
        run: |
          mkdir -p reports/render
          PDF=public/downloads/Manual-do-Participante-CATS-Edicao-Digital-2026.pdf
          EXPECTED=$(node -p "require('./public/downloads/manual-preflight.json').pageCount")
          ACTUAL=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          test "$ACTUAL" = "$EXPECTED"
          pdftoppm -jpeg -r 45 -jpegopt quality=45 "$PDF" reports/render/page >/dev/null 2>&1
          RENDERED=$(find reports/render -type f -name 'page-*.jpg' | wc -l)
          test "$RENDERED" = "$EXPECTED"
          test -z "$(find reports/render -type f -name 'page-*.jpg' -size 0)"
      - name: veraPDF PDF/UA-1 validation
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/data" ghcr.io/verapdf/cli:v1.30.2 --format json --flavour ua1 "/data/public/downloads/Manual-do-Participante-CATS-Edicao-Digital-2026.pdf" > reports/verapdf.json
          if ! jq -e '.. | objects | select(has("isCompliant")) | .isCompliant == true' reports/verapdf.json >/dev/null; then
            echo "veraPDF encontrou não conformidades PDF/UA-1:"
            jq -r '.. | objects | select((.status? == "failed") or (.passed? == false) or (.isCompliant? == false)) | [.testNumber // .ruleId // .id // "rule", .description // .message // .status // "failed"] | @tsv' reports/verapdf.json | head -80 || true
            exit 1
          fi
      - name: Runtime smoke 6/6
        run: |
          npm run start -- -p 3100 > /tmp/cats-next.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3100/api/health >/dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3100 npm run audit:6
          kill $PID 2>/dev/null || true
          trap - EXIT
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser accessibility and E2E
        run: npm run e2e:qep
      - name: Core regression smoke/E2E in Chromium
        run: npx playwright test --project=chromium e2e/manual.spec.ts e2e/publication-hotfix.spec.ts e2e/epub-release.spec.ts
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qep-release-evidence
          path: |
            rebuild/reports/
            rebuild/public/downloads/manual-preflight.json
            rebuild/public/downloads/Manual-do-Participante-CATS-Edicao-Digital-2026.pdf
          retention-days: 30

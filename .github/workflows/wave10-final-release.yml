name: Manual CATS Canonical Release Gate

on:
  push:
    branches: [main]
    paths:
      - 'rebuild/**'
      - '.github/workflows/wave10-final-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rebuild
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build canonical runtime with 30/30 and 90/90 gates
        run: npm run build
      - name: Smoke test
        run: npm run smoke
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local production server
        shell: bash
        run: |
          npm start -- -p 3000 >/tmp/cats-release.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cats-release.log
          exit 1
      - name: Audit 6/6 against local release
        run: BASE_URL=http://127.0.0.1:3000 npm run audit:6
      - name: E2E final desktop and mobile
        run: E2E_BASE_URL=http://127.0.0.1:3000 npm run e2e:final

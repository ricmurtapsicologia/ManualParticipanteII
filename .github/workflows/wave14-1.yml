name: Manual CATS Wave 14.1 Continuation Typography Gate

on:
  push:
    branches: [wave14-1-continuation-typography]
    paths:
      - '.github/workflows/wave14-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  continuation-typography-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Wave 14.1 source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('rebuild/app/page.tsx')
          source = page.read_text()

          old = "  const runningRight = currentChapter ? `CAPÍTULO ${currentChapter.chapter}` : currentPart ? `PARTE ${currentPart.part}` : '2026';\n"
          new = old + "  const pageRole = current.cover ? 'cover' : currentChapter ? (currentChapter.openingPage === currentPageNumber ? 'chapter-opening' : 'chapter-continuation') : currentPart?.openingPage === currentPageNumber ? 'part-opening' : 'standard';\n"
          if old not in source:
              raise SystemExit('runningRight anchor not found')
          source = source.replace(old, new, 1)

          old = '    <main className="main"><div className="book"><article className={`page${current.cover ? \' cover\' : \'\'}`} lang="pt-BR" data-testid="book-page">'
          new = '    <main className="main"><div className="book"><article className={`page${current.cover ? \' cover\' : \'\'}${pageRole === \'chapter-opening\' ? \' chapterOpening\' : \'\'}${pageRole === \'chapter-continuation\' ? \' chapterContinuation\' : \'\'}`} lang="pt-BR" data-testid="book-page" data-page-role={pageRole}>'
          if old not in source:
              raise SystemExit('article anchor not found')
          source = source.replace(old, new, 1)

          old = '<h2>{current.title}</h2>{current.paragraphs.map((text, i) => <p key={i}>{text}</p>)}'
          new = "{pageRole === 'chapter-continuation' && currentChapter ? <div className=\"continuationHeading\" data-testid=\"continuation-heading\"><span>Capítulo {currentChapter.chapter}</span><strong>Continuação</strong></div> : <h2 data-testid={pageRole === 'chapter-opening' ? 'chapter-title' : undefined}>{current.title}</h2>}{current.paragraphs.map((text, i) => <p key={i}>{text}</p>)}"
          if old not in source:
              raise SystemExit('heading anchor not found')
          source = source.replace(old, new, 1)
          page.write_text(source)

          css = Path('rebuild/app/globals.css')
          styles = css.read_text()
          addition = '.page.chapterOpening h2{position:relative;padding-bottom:14px;margin-bottom:22px}.page.chapterOpening h2:after{content:"";position:absolute;left:0;bottom:0;width:58px;height:3px;border-radius:999px;background:var(--orange)}.continuationHeading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px;padding:0 0 10px;border-bottom:1px solid var(--line);font-size:10px;line-height:1.3;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}.continuationHeading strong{font-size:10px;color:#0f6260;letter-spacing:.1em}.page.chapterContinuation{padding-top:38px}@media(max-width:700px){.continuationHeading{margin-bottom:16px}.page.chapterContinuation{padding-top:30px}}\n'
          if '.continuationHeading{' not in styles:
              css.write_text(styles.rstrip() + '\n' + addition)

          test = Path('rebuild/e2e/continuation.spec.ts')
          test.write_text("""import { test, expect } from '@playwright/test';

async function setPage(page: any, pageNumber: number) {
  await page.goto('/', { waitUntil: 'networkidle' });
  await page.evaluate((n: number) => localStorage.setItem('cats-rebuild-page', String(n - 1)), pageNumber);
  await page.reload({ waitUntil: 'networkidle' });
  await expect(page.getByTestId('page-counter')).toContainText(`${pageNumber} / 249`);
}

test('chapter opening and continuation have distinct hierarchy', async ({ page }) => {
  await setPage(page, 106);
  const book = page.getByTestId('book-page');
  await expect(book).toHaveAttribute('data-page-role', 'chapter-opening');
  await expect(page.getByTestId('chapter-title')).toContainText('Perguntas e escuta');
  await expect(page.getByTestId('continuation-heading')).toHaveCount(0);

  await setPage(page, 107);
  await expect(book).toHaveAttribute('data-page-role', 'chapter-continuation');
  await expect(page.getByTestId('continuation-heading')).toContainText('Capítulo 14');
  await expect(page.getByTestId('continuation-heading')).toContainText('Continuação');
  await expect(book.locator('h2')).toHaveCount(0);
});
""")
          PY
      - name: Install dependencies
        working-directory: rebuild
        run: npm install --no-audit --no-fund
      - name: Validate semantic corpus
        working-directory: rebuild
        run: |
          npm run semantic:migrate
          npm run semantic:validate
          npm run navigation:build
          npm run navigation:validate
          npm run validate
      - name: Build and smoke
        working-directory: rebuild
        run: |
          npm run build
          npm run smoke
      - name: Install Chromium
        working-directory: rebuild
        run: npx playwright install --with-deps chromium
      - name: Start local production server
        working-directory: rebuild
        shell: bash
        run: |
          export VERCEL=1
          export VERCEL_ENV=production
          export VERCEL_GIT_COMMIT_REF=main
          export VERCEL_GIT_COMMIT_SHA=$(git rev-parse HEAD)
          export VERCEL_PROJECT_PRODUCTION_URL=manual-participante-cats-digital.vercel.app
          npm start -- -p 3000 >/tmp/wave141-next.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wave141-next.log
          exit 1
      - name: Run full desktop and mobile E2E
        working-directory: rebuild
        run: E2E_BASE_URL=http://127.0.0.1:3000 npm run e2e
      - name: Persist validated Wave 14.1 changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebuild/app/page.tsx rebuild/app/globals.css rebuild/e2e/continuation.spec.ts
          git commit -m "wave14.1: distinguish chapter openings and continuation pages [skip ci]"
          git push origin HEAD:wave14-1-continuation-typography

name: Bootstrap canonical CATS 2026 covers

on:
  push:
    branches: [prontidao/final-6-ondas]
    paths:
      - '.github/workflows/canonical-cover-bootstrap.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prontidao/final-6-ondas
          fetch-depth: 0
      - name: Materialize exact approved artwork
        env:
          DIGITAL_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-d4e8-820e-8f6f-cf520c234d22/raw?se=2026-09-16T20%3A47%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=2151efeb-cef8-51c3-9b44-8021f7b1125c&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T19%3A44%3A24Z&ske=2026-09-17T19%3A44%3A24Z&sks=b&skv=2026-02-06&sig=QY8DhxO05zZBH0yTMIU3Gzcjgw6Zlw4vx9nVxXwrkj4%3D'
          EBOOK_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1b90-820e-b2f6-3d165df43dda/raw?se=2026-09-16T20%3A47%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=35f22810-3bea-56fe-931f-0c40ba348323&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T19%3A44%3A24Z&ske=2026-09-17T19%3A44%3A24Z&sks=b&skv=2026-02-06&sig=MasE7ht7schEPSe/bjYQ3tveKv%2BsyGr8MnrFwjeoXC4%3D'
          HERO_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-8c94-820e-bd4c-14d2bdbe4387/raw?se=2026-09-16T20%3A47%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=b92171ba-52ad-5f3a-ba0d-9a37585ccc08&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T19%3A40%3A11Z&ske=2026-09-17T19%3A40%3A11Z&sks=b&skv=2026-02-06&sig=lTeE4CanmaeW1GbraZD5ibhj%2BHilgLy9/Tj1BtuyVRU%3D'
        run: |
          set -euo pipefail
          mkdir -p rebuild/public/assets/manual-cats/2026
          curl --fail --location --retry 3 --retry-all-errors "$DIGITAL_URL" -o rebuild/public/assets/manual-cats/2026/manual-cats-capa-digital-2026.jpg
          curl --fail --location --retry 3 --retry-all-errors "$EBOOK_URL" -o rebuild/public/assets/manual-cats/2026/manual-cats-capa-ebook-2026.jpg
          curl --fail --location --retry 3 --retry-all-errors "$HERO_URL" -o rebuild/public/assets/manual-cats/2026/manual-cats-hero-2026.jpg
          echo 'd63ae8f1ac4037d85e712da570999e437aadd4357485c719e57e587a7a6561ce  rebuild/public/assets/manual-cats/2026/manual-cats-capa-digital-2026.jpg' | sha256sum -c -
          echo 'f875ce298711604d1fce6aa3dec4acb67e37396ab754e0ab8b276c0686edbf9f  rebuild/public/assets/manual-cats/2026/manual-cats-capa-ebook-2026.jpg' | sha256sum -c -
          echo '0a5f39f5cfc870c902ab7e53701fb74960b229b5ef9008bba362f486bd7885ec  rebuild/public/assets/manual-cats/2026/manual-cats-hero-2026.jpg' | sha256sum -c -
          test "$(stat -c%s rebuild/public/assets/manual-cats/2026/manual-cats-capa-digital-2026.jpg)" = 231228
          test "$(stat -c%s rebuild/public/assets/manual-cats/2026/manual-cats-capa-ebook-2026.jpg)" = 260669
          test "$(stat -c%s rebuild/public/assets/manual-cats/2026/manual-cats-hero-2026.jpg)" = 215370
      - name: Commit canonical assets and retire bootstrap
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f rebuild/public/assets/manual-cats/2026/*.jpg
          git rm .github/workflows/canonical-cover-bootstrap.yml
          git commit -m 'assets: materialize exact approved CATS 2026 covers'
          git push origin HEAD:prontidao/final-6-ondas

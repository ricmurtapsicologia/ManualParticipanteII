name: Publication 30-90-6 + E2E Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'rebuild/**'
      - '.github/workflows/editorial-publication-pr.yml'
  workflow_dispatch:

jobs:
  publication-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: rebuild
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build production application
        run: npm run build

      - name: Layer 1 — 30 editorial controls
        run: npm run audit:30

      - name: Layer 2 — 90 content and integrity controls
        run: npm run audit:90

      - name: Smoke test
        run: npm run smoke

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm run start -- -p 3310 > /tmp/cats-publication-server.log 2>&1 &
          echo $! > /tmp/cats-publication-server.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3310/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cats-publication-server.log
          exit 1

      - name: Layer 3 — 6 runtime release controls
        env:
          BASE_URL: http://127.0.0.1:3310
        run: npm run audit:6

      - name: E2E — complete desktop and mobile traversal
        env:
          E2E_BASE_URL: http://127.0.0.1:3310
        run: npm run e2e:final

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/cats-publication-server.pid ]; then kill $(cat /tmp/cats-publication-server.pid) || true; fi
          if [ -f /tmp/cats-publication-server.log ]; then tail -100 /tmp/cats-publication-server.log; fi

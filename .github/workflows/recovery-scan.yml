name: Recovery History Scan

on:
  push:
    branches: [rebuild-clean-v1]
    paths:
      - '.github/workflows/recovery-scan.yml'
      - 'rebuild/scripts/recovery-scan.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Scan historical corpus payloads
        run: node rebuild/scripts/recovery-scan.mjs
      - name: Persist scan report
        run: |
          if git diff --quiet -- rebuild/recovery/history-scan.json rebuild/recovery/history-scan.md; then
            echo "Recovery report unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebuild/recovery/history-scan.json rebuild/recovery/history-scan.md
          git commit -m "recovery: persist historical corpus scan [skip ci]"
          git push origin HEAD:rebuild-clean-v1
